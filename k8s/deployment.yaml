apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
      - name: catalog-service
        image: ghcr.io/comp09034-26/comp09034-26-lab-cicd-gitops-mmaarij:ade2660919e7b20a36f6e5201fcf64dcb7515304
        ports:
        - containerPort: 9001
      imagePullSecrets:
        - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  type: LoadBalancer
  selector:
    app: catalog-service
  ports:
  - port: 9001
    targetPort: 9001
